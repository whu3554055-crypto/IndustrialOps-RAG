[project]
name = "industrial-ops-rag"
version = "0.1.0"
description = "Industrial equipment ops knowledge RAG platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-milvus>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "pymilvus>=2.4.0",
    "opensearch-py>=2.4.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0; platform_system != 'Darwin'",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "ragas>=0.1.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py310"
