# Prometheus Operator ServiceMonitor 占位
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ior-vllm
  namespace: industrial-ops
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
