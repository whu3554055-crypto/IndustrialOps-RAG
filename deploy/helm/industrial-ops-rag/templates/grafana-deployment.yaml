{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ior.fullname" . }}-grafana-dashboards
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  ior-overview.json: |
{{ .Files.Get "dashboards/ior-overview.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ior.fullname" . }}-grafana-datasources
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "ior.fullname" . }}-prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ior.fullname" . }}-grafana
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}"
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafana.adminPassword | quote }}
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
          {{- with .Values.monitoring.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: dashboards
          configMap:
            name: {{ include "ior.fullname" . }}-grafana-dashboards
        - name: datasources
          configMap:
            name: {{ include "ior.fullname" . }}-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: {{ include "ior.fullname" . }}-grafana-providers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ior.fullname" . }}-grafana-providers
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ior
        orgId: 1
        folder: IndustrialOps-RAG
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ior.fullname" . }}-grafana
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
