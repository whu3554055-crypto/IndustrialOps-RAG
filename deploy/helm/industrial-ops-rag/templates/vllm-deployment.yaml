{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ior.fullname" . }}-vllm
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  replicas: {{ .Values.vllm.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vllm
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - {{ .Values.vllm.model | quote }}
            - --quantization
            - {{ .Values.vllm.quantization | quote }}
            - --gpu-memory-utilization
            - {{ .Values.vllm.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ .Values.vllm.maxModelLen | quote }}
            - --max-num-seqs
            - {{ .Values.vllm.maxNumSeqs | quote }}
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ior.fullname" . }}-vllm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/component: vllm
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
