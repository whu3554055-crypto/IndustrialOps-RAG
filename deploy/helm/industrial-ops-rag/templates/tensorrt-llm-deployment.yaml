{{- if .Values.tensorrtLlm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ior.fullname" . }}-tensorrt-llm
  labels:
    {{- include "ior.labels" . | nindent 4 }}
    app.kubernetes.io/component: tensorrt-llm
spec:
  replicas: {{ .Values.tensorrtLlm.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: tensorrt-llm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tensorrt-llm
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: tensorrt-llm
          # 替换为自建 TRT-LLM 推理镜像（见 serving/tensorrt-llm/README.md）
          image: nvcr.io/nvidia/tensorrt-llm/release:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ior.fullname" . }}-tensorrt-llm
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app.kubernetes.io/component: tensorrt-llm
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
