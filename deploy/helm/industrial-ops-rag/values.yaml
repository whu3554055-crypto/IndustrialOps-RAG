# 默认 values — 生产向；单机请用 -f values-dev-single-node.yaml

global:
  profile: production
  language: zh

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: industrial-ops-rag/gateway
    tag: "0.1.0"
  service:
    port: 8080

agent:
  enabled: true

milvus:
  enabled: true

opensearch:
  enabled: true

postgresql:
  enabled: true

redis:
  enabled: true

minio:
  enabled: true

vllm:
  enabled: true
  replicaCount: 1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq
  gpuMemoryUtilization: 0.90
  maxModelLen: 8192
  maxNumSeqs: 8

tensorrtLlm:
  enabled: true
  replicaCount: 0  # 默认不占用 GPU；切换 activeBackend 后 scale
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  maxBatchSize: 4

llmRouter:
  activeBackend: vllm

embedding:
  device: cpu
  model: BAAI/bge-m3

rerank:
  device: cpu
  model: BAAI/bge-reranker-v2-m3

keda:
  enabled: true
  vllm:
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 30
    cooldownPeriod: 300

monitoring:
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.52.0
    resources: {}
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: "11.0.0"
    adminUser: admin
    adminPassword: <your_grafana_admin_password>  # 生产请改 Secret
    resources: {}

ingest:
  cronJob:
    enabled: false
    schedule: "0 2 * * *"
    backoffLimit: 2
    inputPath: data/raw
    batchSize: 8
    maxDocs: null
    recreate: true
    image:
      repository: industrial-ops-rag/gateway
      tag: "0.1.0"
    resources:
      limits:
        memory: 4Gi
      requests:
        memory: 1Gi
        cpu: 500m

evaluation:
  ragasCronJob:
    enabled: false
    schedule: "0 3 * * 0"
    backoffLimit: 1
    goldenPath: data/eval/golden.jsonl
    gatewayUrl: http://ior-gateway:8080
    outputPath: /reports/ragas_report.json
    image:
      repository: industrial-ops-rag/gateway
      tag: "0.1.0"
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 512Mi
        cpu: 250m

finetune:
  trainJob:
    enabled: false
    profile: train-gpu-24g
    hfHome: /cache/huggingface
    backoffLimit: 0
    activeDeadlineSeconds: 86400
    datasetPath: data/processed/sft_train.jsonl
    outputDir: /models/qlora-adapter
    image:
      repository: industrial-ops-rag/gateway
      tag: "0.1.0"
    resources:
      limits:
        nvidia.com/gpu: 1
