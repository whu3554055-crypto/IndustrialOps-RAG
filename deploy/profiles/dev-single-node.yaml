# IndustrialOps-RAG — 单机开发档（架构全量，数值压缩）
# 单一事实来源；Helm values 应与此对齐
# 学习：docs/m0_infra.md §4

profile: dev-single-node

cluster:
  node_count: 1
  kubernetes_distribution: k3d  # kind | k3d | minikube；见 m0_infra.md §6

gpu:
  count: 1
  vram_gb: 6
  mutual_exclusive_gpu: true  # vLLM 与 TensorRT-LLM 不能同占 GPU；切换见 docs/m4_serving.md §3.2

services:
  milvus:
    enabled: true  # M1 ingest 必须；Compose ior-milvus:19530
    requests_memory: 1Gi
    limits_memory: 2Gi
  opensearch:
    enabled: true  # M1 ingest 必须；Compose :9200
    requests_memory: 512Mi
    limits_memory: 1Gi
    java_opts: "-Xms512m -Xmx512m"
    discovery_type: single-node
  postgresql:
    enabled: true
    requests_memory: 256Mi
    limits_memory: 512Mi
  redis:
    enabled: true
    requests_memory: 128Mi
    limits_memory: 256Mi
  minio:
    enabled: true
    requests_memory: 256Mi
    limits_memory: 512Mi
  prometheus:
    enabled: true
    requests_memory: 256Mi
    limits_memory: 512Mi
  grafana:
    enabled: true
    requests_memory: 128Mi
    limits_memory: 256Mi

llm:
  primary: Qwen/Qwen2.5-7B-Instruct-AWQ
  active_backend: vllm  # 路由默认目标：vllm | tensorrt_llm | api；对应 .env LLM_ACTIVE_BACKEND
  backends:
    vllm:
      enabled: true
      # OpenAI API model id（GET /v1/models）；Docker 挂载路径，非 HF 仓库名
      served_model_id: /models/Qwen2.5-7B-Instruct-AWQ
      port: 8000  # VLLM_BASE_URL=http://localhost:8000/v1
      quantization: awq_marlin  # 6GB 推荐；K8s 大显存可用 awq
      gpu_memory_utilization: 0.95  # 显存预占比例；OOM 降至 0.88
      max_model_len: 2048  # KV cache 上限；与 Docker --max-model-len 对齐
      max_num_seqs: 2  # 最大并发序列；压测 --concurrency 参考此值
      max_num_batched_tokens: 2048
      enforce_eager: false
    tensorrt_llm:
      enabled: true  # 架构保留；本机分时启服，不与 vLLM 同占 GPU
      port: 8001  # TENSORRT_LLM_BASE_URL=http://localhost:8001/v1
      max_batch_size: 1
      max_input_len: 2048
      max_output_len: 1024
    api:
      enabled: false  # 设为 true 并配 OPENAI_* 可做 GPT-4 等对照

embedding:
  model: BAAI/bge-m3  # ingest + 检索共用；本地优先 models/bge-m3/
  device: cpu  # 6GB GPU 留给 LLM
  batch_size: 8  # run_ingest.py --batch-size 默认对齐

rerank:
  model: BAAI/bge-reranker-v2-m3
  device: cpu
  top_n: 5  # 与 retrieval.rerank_top_n 对齐

retrieval:
  vector_top_k: 20  # Milvus 召回；见 docs/m2_retrieval.md §6
  bm25_top_k: 20    # OpenSearch 召回
  rrf_k: 60         # RRF 平滑常数 k
  rerank_top_n: 5   # 最终条数；M3 context 默认同源
  llamaindex_modes:  # Gateway /v1/search 可选的 LI 模式列表
    - vector
    - bm25
    - summary
    - tree
    - graph
    - router
    - sub_question

agent:
  max_history_turns: 3  # rewrite 可见最近 N 轮；见 docs/m3_agent.md §5
  include_history_in_generation: false  # true=生成也拼 history；默认 false（ADR）
  self_check_enabled: true  # LLM 质检答案；关可省 1～3 次 vLLM 调用
  refuse_on_low_confidence: true  # rerank top score < -2.0 直接拒答
  # context_top_k: 缺省=retrieval.rerank_top_n(5)；勿为验收压到 1
  # max_chars_per_chunk: context 超 max_model_len 时按边界截断单 chunk

finetune:
  base_model: models/Qwen2.5-7B-Instruct  # hf --local-dir；缺失时 train_qlora 回退 Hub；推理 AWQ 见 m5_finetune.md
  dataset_max_samples: 5000  # 调试可改小；见 train_qlora --max-samples
  qlora_r: 8
  qlora_alpha: 16
  lora_dropout: 0.05
  max_seq_length: 2048  # 6GB OOM 时改为 1024
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16  # 有效 batch = 1×16
  gradient_checkpointing: true
  bnb_4bit: true
  learning_rate: 2.0e-4
  num_train_epochs: 1

evaluation:
  ragas:
    golden_path: data/eval/golden.jsonl
    gateway_url: http://localhost:8080
    judge_base_url: http://localhost:8000/v1  # RAGAS judge；默认同 vLLM OpenAI API
    judge_model: Qwen/Qwen2.5-7B-Instruct-AWQ

gateway:
  rate_limit_qps: 30
  rate_limit_burst: 60

ingest:
  cronJob:
    namespace: industrial-ops
    cronJobName: ior-ingest

persistence:
  session_backend: file  # file | postgresql
  session_file: reports/chat_sessions.json
  retrieval_log_backend: file
  retrieval_log_file: reports/retrieval_logs.jsonl

demo:
  corpus_path: data/corpus/demo  # 脱敏演示语料（git 跟踪）；ingest 前 seed_demo_corpus.py
  business_corpus_path: data/corpus/business  # 脱敏真实语料（本地，gitignore）；见该目录 README
  golden_example: data/eval/golden_m7.jsonl.example  # M7 业务 golden 模板
  eval_limit: 3  # 演示用 RAGAS/抽检条数；CI dry-run 对齐
  ingest_max_docs: 5  # 演示 ingest 文档上限（与公开样例篇数一致；mini 可改 3）
  gateway_url: http://localhost:8080
  feedback_backend: file  # file | postgresql；本机默认 file 免 DB 迁移
  feedback_file: reports/feedback_events.jsonl

keda:
  enabled: true  # K8s 自动扩缩 vLLM；本机 Docker 可不装 KEDA，验收只查此项为 true
  vllm:
    min_replicas: 1
    max_replicas: 1  # dev 单机无法扩多副本；生产 overlay 改为 10+
    polling_interval: 30  # 秒；查 Prometheus 指标频率
    cooldown_period: 300  # 秒；缩容前等待，防抖动
  scaled_job:
    ingest_parallelism: 1
    ragas_parallelism: 1

startup_order:
  # K8s 分时启服顺序；本机 Compose 可并行 up，vLLM 单独 Docker — m0_infra.md §4.1
  - postgresql
  - redis
  - minio
  - milvus
  - opensearch
  - ingest_job
  - vllm
  - gateway
  - prometheus
  - grafana
  # tensorrt_llm: 手动切换 active_backend 后启动；步骤 docs/m4_serving.md §3.2
  # ragas_cronjob / train_job: 按需
