# 线上 GPU 主机一键 QLoRA（24GB+ 推荐）
# 用法见 docs/m5_online_train.md

services:
  qlora-train:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.finetune
    image: industrial-ops-rag/finetune:local
    environment:
      IOR_PROFILE: train-gpu-24g
      HF_HOME: /workspace/.cache/huggingface
      # 勿设 HF_ENDPOINT=hf-mirror.com（huggingface_hub ≥1.17 不兼容）
    volumes:
      - ../../data:/workspace/data:ro
      - ../../models:/workspace/models
      - hf_cache:/workspace/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --profile
      - train-gpu-24g
      - --dataset
      - /workspace/data/processed/sft_train.jsonl
      - --output-dir
      - /workspace/models/qlora-adapter

volumes:
  hf_cache:
