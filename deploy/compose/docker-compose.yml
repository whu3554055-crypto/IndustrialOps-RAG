# 本地开发：中间件子集（LLM 建议 K8s 或本机 vLLM 进程）
# 全架构组件在 Helm chart 中均保留

services:
  postgresql:
    image: postgres:16-alpine
    container_name: ior-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ior_dev}
      POSTGRES_DB: ${POSTGRES_DB:-industrial_ops}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ior-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    container_name: ior-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ior-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: ior-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev}
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    deploy:
      resources:
        limits:
          memory: 2G

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: ior-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "9200:9200"
    volumes:
      - os_data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pg_data:
  minio_data:
  etcd_data:
  milvus_data:
  os_data:

networks:
  default:
    name: industrial-ops-rag
